name: RFC Conformance

on:
  pull_request:
    paths:
      - "docs/RFCs/**"
      - "tools/**"
      - "build.zig"
      - ".github/workflows/rfc-conformance.yml"
  push:
    branches: [main]
    paths:
      - "docs/RFCs/**"
      - "tools/**"
      - "build.zig"
      - ".github/workflows/rfc-conformance.yml"

permissions:
  contents: write

concurrency:
  group: rfc-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v6

      - uses: vercel-labs/setup-zig@v1
        with:
          version: 0.16.0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install semantic lock dependency
        run: python -m pip install --disable-pip-version-check blake3

      - name: Generate semantic lockfiles
        if: github.event_name == 'push'
        run: python tools/rfc_lock.py --write

      - name: Verify semantic lockfiles
        if: github.event_name == 'pull_request'
        run: python tools/rfc_lock.py --check

      - name: Run all RFC executable conformance proofs
        run: zig build conformance

      - name: Mark fully bound requirements verified
        if: github.event_name == 'push'
        run: python tools/rfc_lock.py --write --verify

      - name: Commit generated lockfiles
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet -- docs/RFCs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/RFCs/*/implemented/manifest.yml
          git commit -m "chore(rfc): regenerate semantic lockfiles"
          git push
